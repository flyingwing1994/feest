<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Party-scherm</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#0d0a16;--fg:#fff;--muted:#bdb3d6;--acc:#ff5fa2;--acc2:#7c5cff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(1200px 700px at 20% 10%,#2a1850 0%,var(--bg) 60%);color:var(--fg);font-family:system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.wrap{display:grid;grid-template-columns:1.6fr 1fr;gap:3vw;height:100%;padding:4vh 4vw}
h1{font-size:4.2vw;margin:0 0 2vh}
.np{display:flex;gap:2.5vw;align-items:center;background:rgba(255,255,255,.06);border-radius:2vw;padding:2.5vw}
.np img{width:16vw;height:16vw;object-fit:cover;border-radius:1.2vw;background:#222}
.np .t{font-size:2.6vw;font-weight:700;line-height:1.15}.np .a{font-size:1.8vw;color:var(--muted);margin-top:.6vh}
.label{font-size:1.2vw;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:1vh}
.fotos{margin-top:3vh;height:38vh;border-radius:2vw;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:1.6vw}
.qr{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.qr img{width:26vw;height:26vw;background:#fff;border-radius:2vw;padding:1.2vw}
.req{margin-top:3vh}.req div{font-size:1.5vw;padding:.6vh 0;border-bottom:1px solid rgba(255,255,255,.08)}.req small{color:var(--muted)}
.req:not(.hidden)+.fotos{height:16vh}
.qr .cta{font-size:2.2vw;font-weight:700;margin-top:3vh}.qr .sub{font-size:1.4vw;color:var(--muted);margin-top:1vh}
</style>
</head>
<body>
<div class="wrap">
  <section>
    <h1 id="titel">🎉 Feest</h1>
    <div class="label">Nu speelt</div>
    <div class="np"><img id="cover" alt=""><div><div class="t" id="nt">–</div><div class="a" id="na"></div></div></div>
    <div class="req hidden" id="req"><div class="label">Aangevraagd</div><div id="reqlijst"></div></div>
    <div class="fotos" id="fotos">📸 Hier komen straks de foto's van iedereen</div>
  </section>
  <section class="qr">
    <img id="qr" alt="QR">
    <div class="cta">Scan mij! 🎶📸</div>
    <div class="sub">Nummer aanvragen · Foto's delen</div>
  </section>
</div>
<script>
const $ = id => document.getElementById(id);
function qrSvg(text){ const q = qrcode(0, 'M'); q.addData(text); q.make(); return 'data:image/svg+xml;utf8,' + encodeURIComponent(q.createSvgTag({ cellSize: 8, margin: 1, scalable: true })); }
fetch('/api/status').then(r => r.json()).then(s => { $('qr').src = qrSvg(s.publicUrl); });
function toon(s) {
  $('titel').textContent = '🎉 ' + (s.titel || 'Feest');
  const np = s.nowPlaying;
  if (np && (np.status === 'playing' || np.status === 'paused') && np.titel) {
    $('nt').textContent = np.titel + (np.status === 'paused' ? ' ⏸' : '');
    $('na').textContent = [np.artiest, np.album].filter(Boolean).join(' · ');
    if (np.afbeelding) $('cover').src = np.afbeelding;
  } else { $('nt').textContent = 'Even stil… 🤫'; $('na').textContent = ''; $('cover').removeAttribute('src'); }
  const v = s.verzoeken || [];
  $('req').classList.toggle('hidden', !v.length);
  $('reqlijst').replaceChildren(...v.map(x => { const d = document.createElement('div'); d.textContent = `${x.artiest} – ${x.titel} `; if (x.naam) { const n = document.createElement('small'); n.textContent = '· ' + x.naam; d.append(n); } return d; }));
}
function verbind() {
  const es = new EventSource('/api/stream');
  es.onmessage = e => toon(JSON.parse(e.data));
  es.onerror = () => { es.close(); setTimeout(verbind, 5000); };
}
verbind();
// tv: scherm wakker houden
navigator.wakeLock?.request('screen').catch(() => {});
</script>
</body>
</html>
